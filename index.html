<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Besties pour la vie ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#ffd8ec,#e8dcff);color:#321b35;text-align:center}
main{max-width:650px;margin:auto;padding:15px}
.card{background:#fff;padding:20px;border-radius:25px;margin:15px 0;box-shadow:0 8px 25px #0002}
input{width:100%;padding:14px;border:2px solid #f2cde0;border-radius:14px;margin:6px 0 12px}
button{border:0;border-radius:14px;padding:13px;margin:5px;font-weight:bold;cursor:pointer}
.btn{background:linear-gradient(135deg,#ff4f9a,#875cf5);color:white}
.gray{background:#999;color:white}
.hidden{display:none}
.row{display:flex;flex-wrap:wrap;justify-content:center}
.row button{flex:1;min-width:130px}
#crowns{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.crown{font-size:30px;background:#ffe1ee}
.used{background:#888;color:white}
#mission{font-size:18px;font-weight:bold;margin:15px 0}
#confetti{position:fixed;inset:0;pointer-events:none}
.code{font-size:30px;font-weight:bold;letter-spacing:6px}
.score{font-size:20px}
</style>
</head>

<body>

<canvas id="confetti"></canvas>

<main>

<div id="home" class="card">
<h1>👑 Besties pour la vie ❤️</h1>
<p>Un jeu pour deux, même à distance.</p>

<input id="name" placeholder="Votre prénom">

<div class="row">
<button class="btn" id="create">👑 Nouvelle partie</button>
<button class="btn" id="show">🔗 Rejoindre</button>
</div>

<div id="joinBox" class="hidden">
<input id="codeInput" placeholder="Code de la partie" maxlength="6">
<button class="btn" id="join">💕 Rejoindre</button>
</div>
</div>


<div id="game" class="hidden">

<div class="card">
<h2>👑 Besties pour la vie</h2>

<p>Code de la partie :</p>
<div class="code" id="gameCode">------</div>

<p id="players"></p>

<div class="score">
🏆 <span id="score1">0</span>
&nbsp;&nbsp; -
&nbsp;&nbsp;
<span id="score2">0</span> 🏆
</div>

<button class="btn" id="share">💌 Partager</button>
</div>


<div class="card">

<h2>👑 Choisissez une couronne</h2>

<div id="crowns"></div>

<div id="mission"></div>

</div>


<div id="final" class="card hidden">
<h1>💕❤️💕</h1>
<h2>Meilleures amies pour la vie ❤️</h2>
<p>Les 20 couronnes sont terminées !</p>
</div>

<button class="btn" id="newGame">🆕 Nouvelle partie</button>

</div>

</main>


<script type="module">

import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import{getAuth,signInAnonymously,onAuthStateChanged}
from"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import{getDatabase,ref,get,set,update,onValue,runTransaction}
from"https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";


const firebaseConfig={
apiKey:"AIzaSyB8TBx_SigmRrWUiV5Aq9juJnaWeg-4so",
authDomain:"bestie-pour-la-vie-22c50.firebaseapp.com",
projectId:"bestie-pour-la-vie-22c50",
storageBucket:"bestie-pour-la-vie-22c50.firebasestorage.app",
messagingSenderId:"1008724192994",
appId:"1:1008724192994:web:34931303c750b1f5ea38bb",
databaseURL:"https://bestie-pour-la-vie-22c50-default-rtdb.europe-west1.firebasedatabase.app"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

let uid=null;
let code="";
let myName="";
let game=null;

const missions=[
"😂 Fais ta pire grimace et envoie une photo à ta bestie.",
"🎤 Chante un refrain choisi par ta bestie en vocal.",
"🤫 Fais écrire le mot « banane » à ta bestie sans lui expliquer pourquoi.",
"🧠 Devine le plat préféré de ta bestie.",
"💃 Fais une mini-danse ridicule et envoie-la.",
"😈 Donne un surnom ridicule à ta bestie.",
"🎭 Imite une habitude de ta bestie.",
"📸 Envoie une photo prise maintenant avec une pose bizarre.",
"❤️ Raconte votre souvenir commun le plus drôle.",
"🤯 Invente une excuse complètement absurde.",
"💕 Donne trois qualités de ta bestie.",
"😂 Envoie un message complètement absurde.",
"🎤 Parle comme un personnage de dessin animé.",
"🃏 Donne un petit gage à ta bestie.",
"🧠 Pense à une couleur et fais-la deviner.",
"🎬 Inventez une scène de film ensemble.",
"🤪 Inventez votre nom de duo le plus ridicule.",
"💌 Envoie un message inattendu à ta bestie.",
"😈 Révèle une petite habitude amusante de ta bestie.",
"👑 Fais quelque chose de drôle spécialement pour ta bestie."
];

const $=x=>document.getElementById(x);

onAuthStateChanged(auth,u=>{
if(u){
uid=u.uid;
}
});

signInAnonymously(auth).catch(e=>{
console.error(e);
alert("Erreur Firebase : activez l'authentification anonyme.");
});


$("show").onclick=()=>{
$("joinBox").classList.toggle("hidden");
};


function codeRandom(){
let s="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r="";
for(let i=0;i<6;i++)
r+=s[Math.floor(Math.random()*s.length)];
return r;
}


function shuffle(a){
a=[...a];
for(let i=a.length-1;i;i--){
let j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}


async function create(){

myName=$("name").value.trim();

if(!myName){
alert("Écrivez votre prénom ❤️");
return;
}

if(!uid){
alert("Connexion Firebase en cours...");
return;
}

code=codeRandom();

let order=shuffle([...Array(20).keys()]);

game={
players:{
p1:{uid:uid,name:myName,score:0}
},
order:order,
used:Array(20).fill(false),
mission:null
};

await set(ref(db,"games/"+code),game);

localStorage.setItem("besties_code",code);
localStorage.setItem("besties_name",myName);

openGame();

}


$("create").onclick=create;


async function join(){

myName=$("name").value.trim();
code=$("codeInput").value.trim().toUpperCase();

if(!myName){
alert("Écrivez votre prénom ❤️");
return;
}

if(code.length!==6){
alert("Le code doit contenir 6 caractères.");
return;
}

if(!uid){
alert("Connexion Firebase en cours...");
return;
}

let snap=await get(ref(db,"games/"+code));

if(!snap.exists()){
alert("Partie introuvable.");
return;
}

let g=snap.val();

if(g.players.p2){
alert("Cette partie contient déjà deux joueuses.");
return;
}

await update(ref(db,"games/"+code),{
"players/p2":{uid:uid,name:myName,score:0}
});

localStorage.setItem("besties_code",code);
localStorage.setItem("besties_name",myName);

openGame();

}


$("join").onclick=join;


function openGame(){

$("home").classList.add("hidden");
$("game").classList.remove("hidden");
$("gameCode").textContent=code;

onValue(ref(db,"games/"+code),snap=>{

if(!snap.exists())return;

game=snap.val();
render();

});

}


function render(){

if(!game)return;

let p1=game.players.p1;
let p2=game.players.p2;

$("players").textContent=
"👑 "+p1.name+
(p2?" 💕 "+p2.name:" 💕 En attente...");

$("score1").textContent=p1.score||0;
$("score2").textContent=p2?p2.score||0:0;

$("crowns").innerHTML="";

for(let i=0;i<20;i++){

let b=document.createElement("button");

b.className="crown";

if(game.used[i]){

b.classList.add("used");
b.textContent="✓";
b.disabled=true;

}else{

b.textContent="👑";
b.onclick=()=>useCrown(i);

}

$("crowns").appendChild(b);

}


if(game.mission!==null){

$("mission").innerHTML=
"💖 <br>"+missions[game.mission];

}else{

$("mission").innerHTML="";
}


if(game.used.filter(Boolean).length===20){

$("final").classList.remove("hidden");

}

}


async function useCrown(i){

if(game.used[i])return;

let mission=game.order[i];

let result=await runTransaction(
ref(db,"games/"+code),
g=>{

if(!g||g.used[i])return;

g.used[i]=true;
g.mission=mission;

return g;

});

if(!result.committed)return;

let player=
game.players.p1.uid===uid?"p1":
game.players.p2?.uid===uid?"p2":null;

if(player){

await runTransaction(
ref(db,"games/"+code+"/players/"+player+"/score"),
s=>(s||0)+1
);

}

confetti();

}


function confetti(){

let c=$("confetti");
let x=c.getContext("2d");

c.width=innerWidth;
c.height=innerHeight;

let a=[];

for(let i=0;i<150;i++){

a.push({
x:Math.random()*c.width,
y:-10,
v:2+Math.random()*6,
s:4+Math.random()*7,
l:100
});

}

function draw(){

x.clearRect(0,0,c.width,c.height);

a.forEach(p=>{

p.y+=p.v;
p.l--;

x.fillStyle=
"hsl("+Math.random()*360+",90%,60%)";

x.fillRect(p.x,p.y,p.s,p.s);

});

a=a.filter(p=>p.l>0&&p.y<c.height);

if(a.length)requestAnimationFrame(draw);

}

draw();

}


$("share").onclick=async()=>{

let text=
"💕 Rejoins ma partie Besties pour la vie !\n"+
"Code : "+code;

if(navigator.share){

await navigator.share({
title:"Besties pour la vie ❤️",
text:text
});

}else{

await navigator.clipboard.writeText(text);

alert("Message copié ❤️");

}

};


$("newGame").onclick=()=>{

localStorage.removeItem("besties_code");

location.reload();

};


let savedCode=localStorage.getItem("besties_code");
let savedName=localStorage.getItem("besties_name");

if(savedCode&&savedName){

code=savedCode;
myName=savedName;

$("name").value=savedName;

setTimeout(()=>{

if(uid)openGame();

},1000);

}

</script>

</body>
</html>

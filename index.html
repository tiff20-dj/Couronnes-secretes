<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Besties pour la vie ❤️</title>
<style>
body{font-family:Arial;text-align:center;background:#ffe6f2;margin:0;padding:20px}
h1{color:#d63384}
button{padding:14px;margin:8px;border:0;border-radius:12px;font-size:16px}
input{padding:12px;border-radius:10px;border:1px solid #ccc}
#game{display:none}
#finish{display:none}
</style>
</head>
<body>
<h1>👑 Besties pour la vie ❤️</h1>
<div id="menu">
<input id="name" placeholder="Votre prénom">
<br>
<button onclick="createRoom()">Créer une partie</button>
<button onclick="joinRoom()">Rejoindre une partie</button>
<br>
<input id="code" placeholder="Code de la partie">
<p id="msg"></p>
</div>

<div id="game">
<p id="players"></p>
<div id="crowns"></div>
<div id="mission"></div>
</div>

<div id="finish">
<h2>💖 Meilleures amies pour la vie ❤️</h2>
<p>👑 Partie terminée ! 👑</p>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script>
const firebaseConfig={
apiKey:"AIzaSyB8TBx_SigmRrWUiV5Aq9juJnaWeg4-2so",
authDomain:"bestie-pour-la-vie-22c50.firebaseapp.com",
databaseURL:"https://bestie-pour-la-vie-22c50-default-rtdb.europe-west1.firebasedatabase.app",
projectId:"bestie-pour-la-vie-22c50",
storageBucket:"bestie-pour-la-vie-22c50.firebasestorage.app",
messagingSenderId:"1008724192994",
appId:"1:1008724192994:web:34931303c750b1f5ea38bb"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const auth=firebase.auth();
let uid,roomId,roomRef;
  const missions=[
"Envoie une photo de ta grimace la plus bizarre 😂",
"Envoie un vocal en chantant une chanson avec seulement « miaou » 🐱",
"Écris une phrase normale puis ajoute l’emoji le plus bizarre que tu trouves 🤣",
"Donne à ta bestie un surnom complètement ridicule 👑",
"Prends en photo l’objet le plus proche et invente son histoire la plus absurde 😂",
"Décris ta bestie avec seulement 5 emojis 💕",
"Donne 3 indices sur ce que tu fais actuellement 🕵️",
"Écris un message comme une princesse qui parle à son chevalier 👸",
"Envoie une vidéo de 5 secondes avec ta pose la plus dramatique 🎭",
"Envoie un vocal avec 3 imitations d’animaux 🐸🐔🐵"];
  missions.push(
"Inventez un faux fait complètement absurde sur vous. Votre bestie doit dire vrai ou faux 😂",
"Si ta bestie était un plat, lequel serait-elle et pourquoi ? 🍕",
"Écris une phrase sans utiliser les lettres A ni E 😈",
"Envoie ton dernier emoji et invente une histoire folle expliquant pourquoi il représente votre amitié 🤣",
"Envoie un vocal avec une voix de bébé pour demander quelque chose 👶",
"Envoie une vidéo de 5 secondes avec ta danse la plus ridicule 💃",
"Décris ta bestie comme l’héroïne d’un film complètement fou 🎬",
"Écris une phrase tellement dramatique qu’on dirait la fin d’une série 😭",
"Présente 3 qualités de ta bestie comme si tu annonçais les résultats d’un concours 🏆",
"Dans 20 ans, notre amitié sera encore plus folle parce que… ❤️"
);
 auth.signInAnonymously().then(()=>{
uid=auth.currentUser.uid;
});

function message(t){
document.getElementById("msg").textContent=t;
}

function code(){
return Math.random().toString(36).substring(2,8).toUpperCase();
}

function melange(a){
return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
}

async function createRoom(){
await auth.signInAnonymously();
uid=auth.currentUser.uid;
roomId=code();
roomRef=db.ref("rooms/"+roomId);
  const ordre=melange([...Array(20).keys()]);
await roomRef.set({
ordre:ordre,
used:{},
players:{[uid]:document.getElementById("name").value||"Joueuse"},
last:-1,
finished:false
});
document.getElementById("code").value=roomId;
ecouter();
}

async function joinRoom(){
await auth.signInAnonymously();
uid=auth.currentUser.uid;
roomId=document.getElementById("code").value.trim().toUpperCase();
roomRef=db.ref("rooms/"+roomId);
const s=await roomRef.get();

if(!s.exists()){
message("❌ Partie introuvable");
return;
}
const r=s.val();
if(Object.keys(r.players||{}).length>=2){
message("❌ Cette partie est déjà complète");
return;
}
await roomRef.child("players/"+uid).set(
document.getElementById("name").value||"Joueuse"
);
ecouter();
}
function ecouter(){
document.getElementById("menu").style.display="none";
document.getElementById("game").style.display="block";

roomRef.on("value",s=>{
const r=s.val();
if(!r)return;

document.getElementById("players").textContent=
"👭 "+Object.values(r.players||{}).join(" ❤️ ");

if(r.finished){
document.getElementById("game").style.display="none";
document.getElementById("finish").style.display="block";
return;
}

afficher(r);
});
}

function afficher(r){
const zone=document.getElementById("crowns");
zone.innerHTML="";

r.ordre.forEach((m,i)=>{
const b=document.createElement("button");
b.textContent=r.used&&r.used[i]?"⬜":"👑";
b.style.fontSize="30px";
b.onclick=()=>couronne(i);
zone.appendChild(b);
});
}

async function couronne(i){
const s=await roomRef.get();
const r=s.val();

if(r.used&&r.used[i])return;

r.used=r.used||{};
r.used[i]=true;
r.last=i;

if(Object.keys(r.used).length>=20)
r.finished=true;

await roomRef.update({
used:r.used,
last:r.last,
finished:r.finished
});

document.getElementById("mission").textContent=
"💖 "+missions[r.ordre[i]];
confettis();
}

function confettis(){
for(let i=0;i<25;i++){
const c=document.createElement("span");
c.textContent="🎉";
c.style.position="fixed";
c.style.left=Math.random()*100+"%";
c.style.top="0";
c.style.fontSize="25px";
document.body.appendChild(c);
setTimeout(()=>c.remove(),1200);
}
}
</script>
</body>
</html>
